<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Slides - The African Apostolic Church</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f5f5f5;
      color: #1f2937;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
    }

    .container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      height: 100vh;
      overflow-y: auto;
      padding: 20px;
      position: fixed;
      width: 250px;
    }

    .sidebar-header {
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 30px;
      padding-bottom: 20px;
    }

    .sidebar-header h2 {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .nav-menu {
      list-style: none;
    }

    .nav-menu li {
      margin-bottom: 10px;
    }

    .nav-menu a {
      border-radius: 5px;
      color: white;
      display: block;
      font-size: 14px;
      padding: 12px 15px;
      text-decoration: none;
      transition: background 0.3s;
    }

    .nav-menu a:hover,
    .nav-menu a.active {
      background: rgba(255, 255, 255, 0.2);
    }

    .logout-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 0;
      border-radius: 5px;
      color: white;
      cursor: pointer;
      font-size: 14px;
      margin-top: 30px;
      padding: 12px 15px;
      width: 100%;
    }

    .main-content {
      flex: 1;
      margin-left: 250px;
      padding: 30px;
    }

    .header {
      align-items: center;
      display: flex;
      gap: 16px;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .header h1 {
      color: #333;
      font-size: 28px;
    }

    .header p {
      color: #6b7280;
      margin-top: 6px;
    }

    .btn {
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      padding: 11px 18px;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .btn-warning {
      background: #f59e0b;
      color: #111827;
    }

    .slides-grid {
      display: grid;
      gap: 20px;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    }

    .slide-card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }

    .slide-card img {
      background: #dbeafe;
      display: block;
      height: 190px;
      object-fit: cover;
      width: 100%;
    }

    .slide-body {
      padding: 16px;
    }

    .slide-body h3 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .slide-meta {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .status-badge {
      border-radius: 999px;
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 10px;
      padding: 4px 10px;
    }

    .status-badge.published {
      background: #dcfce7;
      color: #166534;
    }

    .status-badge.draft {
      background: #fee2e2;
      color: #991b1b;
    }

    .slide-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .empty-state,
    .loading {
      background: white;
      border-radius: 12px;
      color: #6b7280;
      padding: 30px;
      text-align: center;
    }

    .modal {
      align-items: center;
      background: rgba(15, 23, 42, 0.72);
      display: none;
      inset: 0;
      justify-content: center;
      padding: 20px;
      position: fixed;
      z-index: 1000;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 14px;
      max-height: 92vh;
      max-width: 680px;
      overflow-y: auto;
      padding: 28px;
      width: 100%;
    }

    .modal-header {
      align-items: center;
      display: flex;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .close-btn {
      background: none;
      border: 0;
      cursor: pointer;
      font-size: 30px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .form-group input,
    .form-group textarea {
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font: inherit;
      padding: 11px;
      width: 100%;
    }

    .form-group textarea {
      min-height: 76px;
      resize: vertical;
    }

    .checkbox-row {
      align-items: center;
      display: flex;
      gap: 10px;
    }

    .checkbox-row input {
      width: auto;
    }

    .image-preview {
      border-radius: 10px;
      display: none;
      margin-top: 12px;
      max-height: 220px;
      object-fit: cover;
      width: 100%;
    }

    .image-preview.active {
      display: block;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 22px;
    }

    @media (max-width: 768px) {
      .container {
        display: block;
      }

      .sidebar {
        height: auto;
        position: static;
        width: 100%;
      }

      .main-content {
        margin-left: 0;
        padding: 20px;
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>AAC GBEAAA</h2>
        <p>Admin Panel</p>
      </div>
      <ul class="nav-menu">
        <li><a href="/admin/dashboard">Dashboard</a></li>
        <li><a href="/admin/articles">Articles</a></li>
        <li><a href="/admin/events">Events</a></li>
        <li><a href="/admin/gallery">Gallery</a></li>
        <li><a href="/admin/hero-slides" class="active">Hero Slides</a></li>
        <li><a href="/admin/approvals">Moderation Queue</a></li>
        <li><a href="/admin/audit-logs" id="auditNavLink" style="display:none">Audit Logs</a></li>
        <li><a href="/admin/accounts" id="accountsNavLink" style="display:none">Account Management</a></li>
      </ul>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <main class="main-content">
      <div class="header">
        <div>
          <h1>Hero Slides</h1>
          <p>Manage the homepage hero background slideshow.</p>
        </div>
        <button class="btn btn-primary content-action" onclick="openModal()">Add Hero Slide</button>
      </div>

      <div id="loading" class="loading">Loading hero slides...</div>
      <div id="slidesGrid" class="slides-grid" style="display:none"></div>
    </main>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Add Hero Slide</h2>
        <button class="close-btn" type="button" onclick="closeModal()">&times;</button>
      </div>

      <form id="slideForm">
        <div class="form-group">
          <label for="title">Internal title</label>
          <input id="title" name="title" maxlength="140" placeholder="e.g. Main blue hero">
        </div>

        <div class="form-group">
          <label for="altText">Image description / alt text</label>
          <textarea id="altText" name="altText" maxlength="180" placeholder="Describe the hero image for accessibility"></textarea>
        </div>

        <div class="form-group">
          <label for="sortOrder">Display order</label>
          <input id="sortOrder" name="sortOrder" type="number" value="0">
        </div>

        <div class="form-group checkbox-row">
          <input id="published" name="published" type="checkbox" checked>
          <label for="published">Published on homepage</label>
        </div>

        <div class="form-group">
          <label for="image">Hero image</label>
          <input id="image" name="image" type="file" accept="image/*">
          <img id="imagePreview" class="image-preview" alt="Hero slide preview">
        </div>

        <div class="form-actions">
          <button class="btn btn-secondary" type="button" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" id="submitBtn" type="submit">Save Hero Slide</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let slides = [];
    let currentEditId = null;
    let canEditContent = false;

    const escapeHtml = (value) => String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');

    const escapeAttr = escapeHtml;

    function checkAuth() {
      fetch('/api/admin/check', { credentials: 'include' })
        .then(response => response.json())
        .then(data => {
          if (!data.authenticated) {
            window.location.href = '/admin/login';
            return;
          }
          if (data.requiresPasswordChange) {
            window.location.href = '/admin/change-password';
            return;
          }

          canEditContent = Boolean(data.permissions && data.permissions.canEditContent);

          if (data.permissions && data.permissions.canManageUsers) {
            document.getElementById('accountsNavLink').style.display = 'block';
          }
          if (data.permissions && data.permissions.canViewAuditLogs) {
            document.getElementById('auditNavLink').style.display = 'block';
          }
          if (!canEditContent) {
            document.querySelectorAll('.content-action').forEach(element => {
              element.style.display = 'none';
            });
          }

          loadSlides();
        })
        .catch(() => {
          window.location.href = '/admin/login';
        });
    }

    function loadSlides() {
      fetch('/api/admin/hero-slides', { credentials: 'include' })
        .then(response => response.json())
        .then(data => {
          if (!data.success) throw new Error(data.error || 'Failed to load hero slides');
          slides = data.slides || [];
          renderSlides();
          document.getElementById('loading').style.display = 'none';
          document.getElementById('slidesGrid').style.display = 'grid';
        })
        .catch(error => {
          document.getElementById('loading').textContent = error.message || 'Failed to load hero slides';
        });
    }

    function renderSlides() {
      const grid = document.getElementById('slidesGrid');
      if (!slides.length) {
        grid.innerHTML = '<div class="empty-state">No hero slides yet. Add one to enable the homepage slideshow.</div>';
        return;
      }

      grid.innerHTML = slides.map(slide => `
        <article class="slide-card">
          <img src="${escapeAttr(slide.imageUrl)}" alt="${escapeAttr(slide.altText || slide.title || 'Hero slide')}" onerror="this.src='/assets/images/home2/hero-2-bg-optimized.jpg'">
          <div class="slide-body">
            <span class="status-badge ${slide.published ? 'published' : 'draft'}">${slide.published ? 'Published' : 'Hidden'}</span>
            <h3>${escapeHtml(slide.title || 'Untitled hero slide')}</h3>
            <p class="slide-meta">Order: ${escapeHtml(slide.sortOrder ?? 0)}${slide.updatedAt ? ` - Updated: ${escapeHtml(new Date(slide.updatedAt).toLocaleDateString())}` : ''}</p>
            <div class="slide-actions">
              <button class="btn btn-warning content-action" type="button" onclick="editSlide('${escapeAttr(slide.id)}')">Edit</button>
              <button class="btn btn-danger content-action" type="button" onclick="deleteSlide('${escapeAttr(slide.id)}')">Delete</button>
            </div>
          </div>
        </article>
      `).join('');
    }

    function resetForm() {
      currentEditId = null;
      document.getElementById('slideForm').reset();
      document.getElementById('published').checked = true;
      document.getElementById('sortOrder').value = '0';
      document.getElementById('image').required = true;
      document.getElementById('modalTitle').textContent = 'Add Hero Slide';
      document.getElementById('submitBtn').textContent = 'Save Hero Slide';
      document.getElementById('imagePreview').classList.remove('active');
      document.getElementById('imagePreview').removeAttribute('src');
    }

    function openModal() {
      resetForm();
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
      resetForm();
    }

    function editSlide(id) {
      const slide = slides.find(item => item.id === id);
      if (!slide) return;

      currentEditId = id;
      document.getElementById('modalTitle').textContent = 'Edit Hero Slide';
      document.getElementById('submitBtn').textContent = 'Save Changes';
      document.getElementById('title').value = slide.title || '';
      document.getElementById('altText').value = slide.altText || '';
      document.getElementById('sortOrder').value = slide.sortOrder ?? 0;
      document.getElementById('published').checked = Boolean(slide.published);
      document.getElementById('image').required = false;
      document.getElementById('imagePreview').src = slide.imageUrl;
      document.getElementById('imagePreview').classList.add('active');
      document.getElementById('modal').classList.add('active');
    }

    document.getElementById('image').addEventListener('change', event => {
      const file = event.target.files && event.target.files[0];
      const preview = document.getElementById('imagePreview');
      if (!file) {
        preview.classList.remove('active');
        return;
      }
      preview.src = URL.createObjectURL(file);
      preview.classList.add('active');
    });

    document.getElementById('slideForm').addEventListener('submit', async event => {
      event.preventDefault();

      const title = document.getElementById('title').value.trim() || 'Untitled hero slide';
      const action = currentEditId ? 'update' : 'create';
      if (currentEditId && !confirm(`Save changes to hero slide "${title}"? This updates the homepage slideshow.`)) {
        return;
      }

      const formData = new FormData();
      formData.append('title', title);
      formData.append('altText', document.getElementById('altText').value.trim());
      formData.append('sortOrder', document.getElementById('sortOrder').value || '0');
      formData.append('published', document.getElementById('published').checked ? 'true' : 'false');
      if (document.getElementById('image').files[0]) {
        formData.append('image', document.getElementById('image').files[0]);
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = action === 'create' ? 'Saving...' : 'Updating...';

      try {
        const response = await fetch(currentEditId ? `/api/hero-slides/${encodeURIComponent(currentEditId)}` : '/api/hero-slides', {
          method: currentEditId ? 'PUT' : 'POST',
          credentials: 'include',
          body: formData
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.success) {
          throw new Error(data.error || 'Hero slide save failed');
        }

        closeModal();
        loadSlides();
        if (data.pendingApproval) {
          alert(data.message || 'Hero slide submitted for approval');
        }
      } catch (error) {
        alert(error.message || 'Hero slide save failed');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = currentEditId ? 'Save Changes' : 'Save Hero Slide';
      }
    });

    function deleteSlide(id) {
      const slide = slides.find(item => item.id === id);
      const title = slide?.title || 'this hero slide';
      if (!confirm(`Delete hero slide "${title}"? This removes it from the homepage slideshow.`)) return;

      fetch(`/api/hero-slides/${encodeURIComponent(id)}`, {
        method: 'DELETE',
        credentials: 'include'
      })
        .then(response => response.json().then(data => ({ response, data })))
        .then(({ response, data }) => {
          if (!response.ok || !data.success) {
            throw new Error(data.error || 'Delete failed');
          }
          loadSlides();
          if (data.pendingApproval) {
            alert(data.message || 'Hero slide delete submitted for approval');
          }
        })
        .catch(error => alert(error.message || 'Delete failed'));
    }

    function logout() {
      if (!confirm('Are you sure you want to logout?')) return;
      fetch('/api/admin/logout', { method: 'POST', credentials: 'include' })
        .then(() => {
          window.location.href = '/admin/login';
        });
    }

    checkAuth();
  </script>
</body>

</html>
