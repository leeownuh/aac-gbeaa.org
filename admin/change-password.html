<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password -The African Apostolic Church </title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #102038, #2f4f80);
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
    }
    h1 { margin-bottom: 8px; color: #222; font-size: 24px; }
    p { color: #555; margin-bottom: 18px; font-size: 14px; }
    label { display: block; margin-bottom: 6px; color: #333; font-size: 13px; }
    input {
      width: 100%;
      padding: 11px;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 6px;
      padding: 12px;
      background: #2d5ecf;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .status { min-height: 20px; margin-bottom: 10px; font-size: 14px; }
    .error { color: #b00000; }
    .success { color: #117c29; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Password Change Required</h1>
    <p>Your account is using a temporary or expired credential. Set a new password to continue.</p>
    <div id="status" class="status"></div>
    <form id="changeForm">
      <label for="currentPassword">Current Password</label>
      <input id="currentPassword" type="password" required>

      <label for="newPassword">New Password</label>
      <input id="newPassword" type="password" minlength="12" required>

      <button type="submit">Update Password</button>
    </form>
  </div>

  <script>
    function setStatus(message, type) {
      const element = document.getElementById('status');
      element.textContent = message || '';
      element.className = `status ${type || ''}`.trim();
    }

    fetch('/api/admin/check', { credentials: 'include' })
      .then(r => r.json())
      .then((data) => {
        if (!data.authenticated) {
          window.location.href = '/admin/login';
          return;
        }
        if (!data.requiresPasswordChange) {
          window.location.href = '/admin/dashboard';
        }
      })
      .catch(() => {
        window.location.href = '/admin/login';
      });

    document.getElementById('changeForm').addEventListener('submit', (event) => {
      event.preventDefault();
      setStatus('');

      const payload = {
        currentPassword: document.getElementById('currentPassword').value,
        newPassword: document.getElementById('newPassword').value
      };

      fetch('/api/admin/change-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify(payload)
      })
        .then(r => r.json())
        .then((result) => {
          if (!result.success) {
            throw new Error(result.error || 'Password change failed');
          }
          setStatus('Password updated. Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = '/admin/dashboard';
          }, 1000);
        })
        .catch((error) => {
          setStatus(error.message || 'Password change failed', 'error');
        });
    });
  </script>
</body>
</html>
